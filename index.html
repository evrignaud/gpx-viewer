<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- No maximum-scale: pinch zoom must stay available (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Load several GPX tracks at once, compare them and read their elevation profile on switchable map layers.">
    <title>GPX Viewer</title>

    <!--
      Map tiles come from many different hosts, so img-src has to allow https:
      broadly, and connect-src likewise for ?gpx= links. Everything else is
      locked to this origin. `ws:` covers the Vite dev server's hot-reload
      socket, and style-src allows inline styles because the dev server injects
      CSS as <style> elements.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   img-src 'self' data: blob: https:;
                   style-src 'self' 'unsafe-inline';
                   font-src 'self';
                   script-src 'self';
                   connect-src 'self' ws: wss: https:;
                   object-src 'none';
                   base-uri 'none';
                   form-action 'none'">

    <link rel="icon" href="./favicon.ico" sizes="any">

    <!-- Lato is bundled from @fontsource/lato, imported by src/main.js, so no
         font is fetched from a third party. -->
  </head>

  <body>
    <div id="app">
      <div id="map" class="map"></div>

      <!-- Touch devices have no drag and drop, so a real file picker is the
           only way in for them. Reported as GitHub issue #2. -->
      <div id="toolbar" class="panel toolbar">
        <span class="file-picker">
          <input id="file-input" type="file" accept=".gpx,application/gpx+xml" multiple>
          <label class="button" for="file-input">
            <span aria-hidden="true">&#43;</span> Add GPX
          </label>
        </span>

        <button type="button" id="unit-toggle" class="button"
                aria-live="polite" title="Switch between metric and imperial units">
          <span id="unit-label">km</span>
        </button>

        <button type="button" id="elevation-toggle" class="button" aria-pressed="true">
          <span aria-hidden="true" class="elevation-icon"></span> Elevation
        </button>
      </div>

      <div id="info-panel" class="panel" hidden>
        <button type="button" id="info-toggle" class="panel-toggle"
                aria-expanded="true" aria-controls="info-body">
          <span class="info-name"></span>
          <span class="panel-chevron" aria-hidden="true"></span>
        </button>

        <div id="info-body" class="panel-body">
          <span class="info-start"></span>
          <br/>
          Distance:&nbsp;<span class="info-distance"></span>&nbsp;<span class="unit-distance"></span>
          &mdash; Duration:&nbsp;<span class="info-duration"></span>
          &mdash; Pace:&nbsp;<span class="info-pace"></span>/<span class="unit-distance"></span>
          <br/>
          Elevation:&nbsp;+<span class="info-elevation-gain"></span>&nbsp;<span class="unit-elevation"></span>,
          -<span class="info-elevation-loss"></span>&nbsp;<span class="unit-elevation"></span>
          (net:&nbsp;<span class="info-elevation-net"></span>&nbsp;<span class="unit-elevation"></span>)
          <hr class="info-separator"/>
          Total distance:&nbsp;<span class="info-total-distance"></span>&nbsp;<span class="unit-distance"></span>
          &mdash; Total duration:&nbsp;<span class="info-total-duration"></span>
          &mdash; Total pace:&nbsp;<span class="info-total-pace"></span>/<span class="unit-distance"></span>
          <br/>
          Total elevation:&nbsp;+<span class="info-total-elevation-gain"></span>&nbsp;<span class="unit-elevation"></span>,
          -<span class="info-total-elevation-loss"></span>&nbsp;<span class="unit-elevation"></span>
          (net:&nbsp;<span class="info-total-elevation-net"></span>&nbsp;<span class="unit-elevation"></span>)
        </div>
      </div>

      <div id="track-panel" class="panel" hidden>
        <button type="button" id="track-toggle" class="panel-toggle"
                aria-expanded="false" aria-controls="track-body">
          <span id="track-count">Tracks</span>
          <span class="panel-chevron" aria-hidden="true"></span>
        </button>

        <div id="track-body" class="panel-body" hidden>
          <ul id="track-list" class="track-list"></ul>
          <div class="track-actions">
            <button type="button" id="tracks-show-all" class="button button-small">Show all</button>
            <button type="button" id="tracks-remove-all" class="button button-small">Remove all</button>
          </div>
        </div>
      </div>

      <div id="splash" class="splash">
        <p class="message">Loading</p>
        <div class="spinner" role="progressbar" aria-label="Loading GPX Viewer"></div>
      </div>
    </div>

    <noscript>
      <p class="noscript-warning">GPX Viewer needs JavaScript to render maps and elevation profiles.</p>
    </noscript>

    <!--
      Classic script, so it runs ahead of the deferred module bundle. Referenced
      as a public asset with a leading slash: Vite rewrites that against `base`
      at build time, whereas a relative path makes it try to bundle the file and
      warn that it cannot without type="module".
    -->
    <script src="/boot-diagnostics.js"></script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
