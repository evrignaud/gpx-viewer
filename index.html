<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- No maximum-scale: pinch zoom must stay available (WCAG 1.4.4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
          content="Load several GPX tracks at once, compare them and read their elevation profile on switchable map layers.">
    <title>GPX Viewer</title>

    <!--
      Map tiles are served from many different hosts, so img-src has to allow
      https: broadly; everything else is locked to this origin. `ws:` covers the
      Vite dev server's hot-reload socket. style-src allows inline styles because
      the dev server injects CSS as <style> elements.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   img-src 'self' data: blob: https:;
                   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                   font-src 'self' https://fonts.gstatic.com;
                   script-src 'self';
                   connect-src 'self' ws: wss: https:;
                   object-src 'none';
                   base-uri 'none';
                   form-action 'none'">

    <link rel="icon" href="./favicon.ico" sizes="any">

    <!-- Served over HTTPS: the previous http:// URL was blocked as mixed
         content on the HTTPS GitHub Pages deployment, so the font never
         actually loaded. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
  </head>

  <body>
    <div id="app">
      <div id="map" class="map"></div>

      <div id="info-panel" class="panel" hidden>
        <h4 class="info-name"></h4>
        <span class="info-start"></span>
        <br/>
        Distance:&nbsp;<span class="info-distance"></span>&nbsp;<span class="unit-distance"></span>
        &mdash; Duration:&nbsp;<span class="info-duration"></span>
        &mdash; Pace:&nbsp;<span class="info-pace"></span>/<span class="unit-distance"></span>
        <br/>
        Elevation:&nbsp;+<span class="info-elevation-gain"></span>&nbsp;<span class="unit-elevation"></span>,
        -<span class="info-elevation-loss"></span>&nbsp;<span class="unit-elevation"></span>
        (net:&nbsp;<span class="info-elevation-net"></span>&nbsp;<span class="unit-elevation"></span>)
        <hr class="info-separator"/>
        Total distance:&nbsp;<span class="info-total-distance"></span>&nbsp;<span class="unit-distance"></span>
        &mdash; Total duration:&nbsp;<span class="info-total-duration"></span>
        &mdash; Total pace:&nbsp;<span class="info-total-pace"></span>/<span class="unit-distance"></span>
        <br/>
        Total elevation:&nbsp;+<span class="info-total-elevation-gain"></span>&nbsp;<span class="unit-elevation"></span>,
        -<span class="info-total-elevation-loss"></span>&nbsp;<span class="unit-elevation"></span>
        (net:&nbsp;<span class="info-total-elevation-net"></span>&nbsp;<span class="unit-elevation"></span>)
      </div>

      <div id="splash" class="splash">
        <p class="message">Loading</p>
        <div class="spinner" role="progressbar" aria-label="Loading GPX Viewer"></div>
      </div>
    </div>

    <noscript>
      <p class="noscript-warning">GPX Viewer needs JavaScript to render maps and elevation profiles.</p>
    </noscript>

    <!-- Classic script, so it runs ahead of the deferred module bundle. -->
    <script src="./boot-diagnostics.js"></script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
