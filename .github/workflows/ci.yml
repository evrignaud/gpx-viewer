name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci rather than install, so the run uses exactly the locked tree.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Check nothing outside dist changed
        run: git diff --exit-code

  integration:
    name: Integration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Electron needs an X display even for an offscreen window, which a Linux
      # runner does not have.
      - name: Run integration check under a virtual display
        run: xvfb-run --auto-servernum npm run test:integration
