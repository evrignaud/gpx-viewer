name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci rather than install, so the run uses exactly the locked tree.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Check nothing outside dist changed
        run: git diff --exit-code

  integration:
    name: Integration check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Send Chromium's own diagnostics to stderr, so a start-up failure explains
      # itself in the job log instead of just exiting non-zero.
      ELECTRON_ENABLE_LOGGING: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Kept as its own step so a missing Electron binary, or a missing system
      # library, is distinguishable from a genuine test failure. npm ci is quick
      # enough here that it is worth confirming the binary really was unpacked.
      - name: Report the Electron environment
        run: |
          echo "node    $(node --version)"
          echo "npm     $(npm --version)"
          echo "electron $(npx electron --version)"

      # Built outside xvfb: the build needs no display, and keeping it separate
      # means a build failure is never mistaken for an Electron one.
      - name: Build
        run: npm run build

      # Electron needs an X display even for a hidden window, which a Linux
      # runner does not have. Runs the checker directly rather than through
      # npm run test:integration, which would build a second time.
      - name: Run integration check under a virtual display
        run: xvfb-run --auto-servernum npx electron test/integration/run.js
