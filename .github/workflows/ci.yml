name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, so a release runs exactly these checks rather than a
  # second copy of them that could drift.
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci rather than install, so the run uses exactly the locked tree.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Check nothing outside dist changed
        run: git diff --exit-code

  integration:
    name: Integration check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Built outside xvfb: the build needs no display, and keeping it separate
      # means a build failure is never mistaken for an Electron one.
      - name: Build
        run: npm run build

      # Electron needs an X display even for a hidden window, which a Linux
      # runner does not have.
      #
      # Uses the :run script rather than test:integration, which would build a
      # second time, and rather than calling electron directly, so the required
      # --no-sandbox argument is defined in exactly one place.
      - name: Run integration check under a virtual display
        run: xvfb-run --auto-servernum npm run test:integration:run
